# Weather Style Lab — 안드로이드 APK 자동 빌드
# index.html(앱 화면)을 android 프로젝트에 넣어 APK를 만들고, Releases에 올립니다.
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 앱 화면(index.html)을 안드로이드 앱에 넣기
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Java 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk WeatherStyleLab.apk

      - name: 빌드 결과 보관 (Actions 탭)
        uses: actions/upload-artifact@v4
        with:
          name: WeatherStyleLab-apk
          path: WeatherStyleLab.apk

      - name: Releases에 APK 올리기 (휴대폰 다운로드용)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest WeatherStyleLab.apk \
            --target "${{ github.sha }}" \
            --title "Weather Style Lab 최신 버전 (빌드 #${{ github.run_number }})" \
            --notes "휴대폰에서 아래 WeatherStyleLab.apk를 눌러 내려받아 설치하세요. 처음 설치할 때 '출처를 알 수 없는 앱' 허용이 필요해요." \
            --latest
